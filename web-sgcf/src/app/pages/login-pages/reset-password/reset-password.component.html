<div class="login-container">
  <div class="login-card">
    <h1>SGCF</h1>
    <h2>Login</h2>

    <mdb-form-control>
      <input mdbInput type="email" id="typeEmail" class="form-control" [(ngModel)]="email"/>
      <label mdbLabel class="form-label" for="typeEmail">Digite seu email</label>
    </mdb-form-control>
    <button mdbRipple type="button" class="btn btn-primary btn-block" (click)="CreateToken()" >Entrar</button>

  </div>

</div>
